services:
  postgres:
    image: postgres:17-alpine
    container_name: ecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom # local dev only
      POSTGRES_DB: ecom
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecom -d ecom']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
